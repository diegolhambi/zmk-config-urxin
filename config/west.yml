manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: diegolhambi
      url-base: https://github.com/diegolhambi
    - name: urob
      url-base: https://github.com/urob
    - name: caksoylar
      url-base: https://github.com/caksoylar
  # These modules follow ZMK's versioning scheme: `main` targets ZMK's `main`.
  # Keep them on the tag matching the zmk revision above (v0.3), otherwise they
  # build against APIs that don't exist in v0.3 (e.g. the 2-arg
  # zmk_keymap_layer_activate, and the renamed rgbled_adapter board overlays).
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-keyboard-urxin
      remote: diegolhambi
      revision: main
    - name: zmk-helpers
      remote: urob
      revision: v0.3
    - name: zmk-auto-layer
      remote: urob
      revision: v0.3
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
  self:
    path: config
